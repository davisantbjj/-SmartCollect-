services:
  postgres:
    image: postgres:16
    container_name: smartcollect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smartcollect}
    command: >
      postgres
      -c password_encryption=scram-sha-256
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcollect} -d ${POSTGRES_DB:-smartcollect}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcollect_api
    restart: unless-stopped
    ports:
      - "5013:5013"
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATA_PROTECTION_KEYS_PATH: /home/app/.aspnet/DataProtection-Keys
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smartcollect}
      POSTGRES_USER: ${POSTGRES_USER:-smartcollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-SmartCollect}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-SmartCollect}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: smartcollect_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smartcollect.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  dpkeys:
